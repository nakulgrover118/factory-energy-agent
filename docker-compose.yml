services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      STORE_DIR: /app/store
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      MOCK_LLM: ${MOCK_LLM:-true}
    volumes:
      - store:/app/store
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  store:
